# Basis: handige nodes, upscalers en snelle preview-decoders.
# Wordt door elk profiel gebruikt.
description = "Essentiële nodes, upscalers en hoge-kwaliteit previews"

# -----------------------------------------------------------------------------
#  Custom nodes — altijd op commit of tag pinnen.
#  repo  : git-URL
#  ref   : tag, commit (40 tekens) of branch (branch = niet reproduceerbaar!)
#  optioneel: name = "mapnaam", requirements = false, install_script = false,
#             pip = ["extra-pakket==1.2"]
# -----------------------------------------------------------------------------
[[nodes]]
repo = "https://github.com/rgthree/rgthree-comfy"
ref = "d7297b42f0fa78bec1c0411478f887423c249502"

[[nodes]]
repo = "https://github.com/kijai/ComfyUI-KJNodes"
ref = "37a6c45a07bb06cc392431ddbbc741e691c467f4"

[[nodes]]
repo = "https://github.com/pythongosssss/ComfyUI-Custom-Scripts"
ref = "609f3afaa74b2f88ef9ce8d939626065e3247469"

# -----------------------------------------------------------------------------
#  Modellen
#  dir    : submap onder ComfyUI/models (checkpoints, loras, vae, upscale_models…)
#  file   : bestandsnaam (standaard: laatste deel van de URL)
#  sha256 : controle na download (aanrader; bij Hugging Face wordt de hash van
#           de server gebruikt als je hem weglaat)
# -----------------------------------------------------------------------------

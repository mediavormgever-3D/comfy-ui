# Tokens voor afgeschermde downloads. NOOIT committen.
#
# Kopieer naar:  C:\ComfyUI\secrets.toml   (per PC; Ansible kan dit voor je doen)
#           of:  <repo>\secrets.toml       (voor add-model / mirror; staat in .gitignore)
# Omgevingsvariabelen HF_TOKEN en CIVITAI_TOKEN werken ook en gaan voor.

# https://huggingface.co/settings/tokens  (type: Read). Nodig voor 'gated' modellen
# zoals FLUX.1-dev: accepteer eerst de licentie op de modelpagina met hetzelfde account.
huggingface = "hf_..."

# https://civitai.com/user/account → API Keys
civitai = ""
